! ==============================================================================
! Cisco ASA 5506-X Adaptive Security Appliance (Next-Generation Firewall)
! Role: Perimeter Defense, Zone Segmentation (Outside, Inside, DMZ), NAT & Inspection
! ==============================================================================

enable
configure terminal
hostname ASA-FIREWALL-01

! 1. Interface Security Zone Configuration
interface GigabitEthernet1/1
 nameif outside
 security-level 0
 ip address dhcp setroute
 no shutdown

interface GigabitEthernet1/2
 nameif inside
 security-level 100
 ip address 10.0.0.1 255.255.255.252
 no shutdown

interface GigabitEthernet1/3
 nameif dmz
 security-level 50
 ip address 172.16.90.1 255.255.255.0
 no shutdown

! 2. Network Objects Definition
object network OBJ_INTERNAL_CORP
 subnet 192.168.0.0 255.255.0.0

object network OBJ_DMZ_SERVERS
 subnet 172.16.90.0 255.255.255.0

object network OBJ_PUBLIC_WEB_SERVER
 host 172.16.90.10

! 3. Source Dynamic NAT (PAT) for Outbound Corporate Internet
nat (inside,outside) source dynamic OBJ_INTERNAL_CORP interface

! 4. Access Control Lists (ACLs)
! Allow DMZ Web Server HTTP/HTTPS traffic from outside
access-list ACL_OUTSIDE_IN extended permit tcp any host 172.16.90.10 eq 80
access-list ACL_OUTSIDE_IN extended permit tcp any host 172.16.90.10 eq 443
access-list ACL_OUTSIDE_IN extended permit icmp any any echo-reply

! Block Factory IoT & Cameras from initiating traffic into DMZ or Core Servers
access-list ACL_INSIDE_RULES extended permit ip 192.168.20.0 255.255.255.0 any
access-list ACL_INSIDE_RULES extended permit ip 192.168.50.0 255.255.255.0 any
access-list ACL_INSIDE_RULES extended permit ip 192.168.70.0 255.255.255.0 host 192.168.50.50

access-group ACL_OUTSIDE_IN in interface outside

! 5. Deep Packet Inspection (ICMP, HTTP, SIP VoIP)
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect http
  inspect sip
  inspect dns
exit

! 6. Static Routing to Core Distribution Switch
route inside 192.168.0.0 255.255.0.0 10.0.0.2

write memory
