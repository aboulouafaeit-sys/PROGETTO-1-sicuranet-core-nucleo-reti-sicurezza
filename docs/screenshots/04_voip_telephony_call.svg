<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lcdScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="920" height="540" rx="12" fill="#0b1120" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 908 0 Q 920 0 920 12 L 920 40 L 0 40 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="460" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">
    Cisco CME IP Telephony &amp; Voice Verification (Packet Tracer Real Call Simulation)
  </text>

  <!-- Left Side: Cisco 7960 IP Phone GUI Representation -->
  <g transform="translate(30, 60)">
    <!-- Phone Chassis -->
    <rect width="360" height="440" rx="18" fill="url(#phoneBody)" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Cisco Logo / Phone Model -->
    <text x="180" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">
      CISCO SYSTEMS  |  IP Phone 7960
    </text>

    <!-- LCD Display -->
    <rect x="30" y="50" width="300" height="150" rx="8" fill="url(#lcdScreen)" stroke="#0284c7" stroke-width="2"/>
    
    <!-- LCD Content -->
    <text x="45" y="75" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">101 Admin Office</text>
    <text x="315" y="75" font-family="monospace" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="end">11:22 AM</text>
    <line x1="45" y1="85" x2="315" y2="85" stroke="#0284c7" stroke-width="1.5"/>

    <rect x="45" y="98" width="270" height="50" rx="4" fill="#0284c7" opacity="0.15"/>
    <text x="180" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
      📞 Connected to: 103
    </text>
    <text x="180" y="138" font-family="sans-serif" font-size="11" fill="#075985" text-anchor="middle">
      Factory Plant Floor (00:02:45)
    </text>

    <text x="60" y="185" font-family="monospace" font-size="10" font-weight="bold" fill="#0c4a6e">[ EndCall ]</text>
    <text x="145" y="185" font-family="monospace" font-size="10" font-weight="bold" fill="#0c4a6e">[ Hold ]</text>
    <text x="210" y="185" font-family="monospace" font-size="10" font-weight="bold" fill="#0c4a6e">[ Transf ]</text>
    <text x="280" y="185" font-family="monospace" font-size="10" font-weight="bold" fill="#0c4a6e">[ Mute ]</text>

    <!-- Dial Pad Mockup -->
    <g transform="translate(90, 225)">
      <!-- 1, 2, 3 -->
      <circle cx="25" cy="20" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="25" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">1</text>
      <circle cx="85" cy="20" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="85" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">2</text>
      <circle cx="145" cy="20" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="145" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">3</text>

      <!-- 4, 5, 6 -->
      <circle cx="25" cy="65" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="25" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">4</text>
      <circle cx="85" cy="65" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="85" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">5</text>
      <circle cx="145" cy="65" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="145" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">6</text>

      <!-- 7, 8, 9 -->
      <circle cx="25" cy="110" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="25" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">7</text>
      <circle cx="85" cy="110" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="85" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">8</text>
      <circle cx="145" cy="110" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="145" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">9</text>

      <!-- *, 0, # -->
      <circle cx="25" cy="155" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="25" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">*</text>
      <circle cx="85" cy="155" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="85" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">0</text>
      <circle cx="145" cy="155" r="18" fill="#1e293b" stroke="#64748b"/>
      <text x="145" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">#</text>
    </g>
  </g>

  <!-- Right Side: Router CME Terminal Output -->
  <g transform="translate(420, 60)">
    <rect width="470" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    
    <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="11.5" xml:space="preserve">
      <text x="20" y="35" fill="#38bdf8" font-weight="bold">R1-EDGE-CME# </text>
      <text x="140" y="35" fill="#f0f6fc">show telephony-service ephone</text>
      
      <text x="20" y="60" fill="#8b949e">ephone-1[0] Mac:0001.96C2.B1A4 TCP socket:[1] active</text>
      <text x="20" y="78" fill="#3fb950"> media-active:1 IP:192.168.30.11 50608 7960 keepalive 15</text>
      <text x="20" y="96" fill="#7ee787"> button 1: dn 1 (number 101)  status: CONNECTED</text>

      <text x="20" y="125" fill="#8b949e">ephone-2[1] Mac:0004.9A32.D712 TCP socket:[2] active</text>
      <text x="20" y="143" fill="#58a6ff"> media-active:0 IP:192.168.30.12 50609 7960 keepalive 12</text>
      <text x="20" y="161" fill="#8b949e"> button 1: dn 2 (number 102)  status: IDLE</text>

      <text x="20" y="190" fill="#8b949e">ephone-3[2] Mac:0060.47B8.89FE TCP socket:[3] active</text>
      <text x="20" y="208" fill="#3fb950"> media-active:1 IP:192.168.30.13 50610 7960 keepalive 14</text>
      <text x="20" y="226" fill="#7ee787"> button 1: dn 3 (number 103)  status: CONNECTED</text>

      <!-- DHCP Bindings -->
      <text x="20" y="265" fill="#38bdf8" font-weight="bold">R1-EDGE-CME# </text>
      <text x="140" y="265" fill="#f0f6fc">show ip dhcp binding</text>
      
      <text x="20" y="290" fill="#8b949e">IP address       Client-ID/Hardware address      Type</text>
      <text x="20" y="310" fill="#f0f6fc">192.168.20.11    0100.5079.6668.01 (PC-Admin)    Automatic</text>
      <text x="20" y="330" fill="#f0f6fc">192.168.20.12    0100.5079.6668.02 (PC-Support)  Automatic</text>
      <text x="20" y="350" fill="#58a6ff">192.168.30.11    0100.0196.c2b1.a4 (Phone-101)   Automatic</text>
      <text x="20" y="370" fill="#58a6ff">192.168.30.13    0100.6047.b889.fe (Phone-103)   Automatic</text>
      <text x="20" y="390" fill="#fde047">192.168.60.11    0100.e0b2.8891.aa (Smart-TV)    Automatic</text>
      <text x="20" y="410" fill="#f87171">192.168.70.11    0100.d022.4419.01 (CCTV-Cam01)  Automatic</text>
    </g>
  </g>
</svg>
