<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 888 0 Q 900 0 900 12 L 900 40 L 0 40 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">
    CORE-DIST-SW01 - Cisco Catalyst 3560/3650 L3 Routing Engine &amp; Trunking Verification
  </text>

  <!-- Content -->
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve">
    <!-- Command 1: show ip route -->
    <text x="25" y="68" fill="#38bdf8" font-weight="bold">CORE-DIST-SW01# </text>
    <text x="160" y="68" fill="#f0f6fc">show ip route</text>
    
    <text x="25" y="88" fill="#8b949e">Codes: C - connected, S - static, R - RIP, M - mobile, B - BGP, D - EIGRP</text>
    <text x="25" y="106" fill="#7ee787">Gateway of last resort is 10.0.0.1 to network 0.0.0.0</text>
    <text x="25" y="124" fill="#f0f6fc">S*    0.0.0.0/0 [1/0] via 10.0.0.1 (Uplink to ASA Firewall)</text>
    <text x="25" y="142" fill="#58a6ff">C     10.0.0.0/30 is directly connected, GigabitEthernet0/1</text>
    <text x="25" y="160" fill="#58a6ff">C     192.168.10.0/24 is directly connected, Vlan10 (MGMT)</text>
    <text x="25" y="178" fill="#58a6ff">C     192.168.20.0/24 is directly connected, Vlan20 (DATA_STAFF)</text>
    <text x="25" y="196" fill="#58a6ff">C     192.168.25.0/24 is directly connected, Vlan25 (PRINTERS)</text>
    <text x="25" y="214" fill="#58a6ff">C     192.168.30.0/24 is directly connected, Vlan30 (VOICE_VOIP)</text>
    <text x="25" y="232" fill="#58a6ff">C     192.168.40.0/24 is directly connected, Vlan40 (CORP_WIFI)</text>
    <text x="25" y="250" fill="#58a6ff">C     192.168.50.0/24 is directly connected, Vlan50 (SERVERS_DC)</text>
    <text x="25" y="268" fill="#58a6ff">C     192.168.60.0/24 is directly connected, Vlan60 (FACTORY_SMART_TVS)</text>
    <text x="25" y="286" fill="#58a6ff">C     192.168.70.0/24 is directly connected, Vlan70 (CCTV_CAMERAS)</text>
    <text x="25" y="304" fill="#58a6ff">C     192.168.80.0/24 is directly connected, Vlan80 (FACTORY_OT)</text>

    <!-- Command 2: show interfaces trunk -->
    <text x="25" y="335" fill="#38bdf8" font-weight="bold">CORE-DIST-SW01# </text>
    <text x="160" y="335" fill="#f0f6fc">show interfaces trunk</text>
    
    <text x="25" y="355" fill="#8b949e">Port        Mode         Encapsulation  Status        Native vlan</text>
    <text x="25" y="373" fill="#f0f6fc">Gi0/2       on           802.1q         trunking      1</text>
    <text x="25" y="391" fill="#f0f6fc">Gi0/3       on           802.1q         trunking      1</text>

    <text x="25" y="415" fill="#8b949e">Port        Vlans allowed on trunk</text>
    <text x="25" y="433" fill="#7ee787">Gi0/2       10,20,25,30,40,50,60,70,80,99</text>
    <text x="25" y="451" fill="#7ee787">Gi0/3       10,20,25,30,40,50,60,70,80,99</text>

    <!-- Command 3: ping test -->
    <text x="25" y="480" fill="#38bdf8" font-weight="bold">CORE-DIST-SW01# </text>
    <text x="160" y="480" fill="#f0f6fc">ping 10.0.0.1</text>
    <text x="25" y="500" fill="#3fb950">Sending 5, 100-byte ICMP Echos to 10.0.0.1, timeout is 2 seconds: !!!!! (Success rate: 100%)</text>
  </g>
</svg>
